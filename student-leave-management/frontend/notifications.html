<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - Student Leave System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="header-bar">
    <div class="header-container">
      <div class="brand-section">
        <div class="college-logo-badge">🔔</div>
        <div>
          <div class="brand-title">Notifications & Status Updates</div>
          <div class="brand-subtitle">Real-time alerts for leave progression and parent responses</div>
        </div>
      </div>
      <div class="header-actions" id="header-user-info">
        <!-- Injected via Auth.js -->
      </div>
    </div>
  </header>

  <!-- Navigation Bar -->
  <div class="demo-role-banner">
    <div><a href="student.html" style="color: #ffffff; text-decoration: none; font-weight: 600;">← Back to Student Dashboard</a></div>
    <div><span>Status updates trigger automatically upon approval/acknowledgement</span></div>
  </div>

  <main class="main-container" style="max-width: 800px;">
    
    <div class="card">
      <div class="card-header">
        <div class="card-title">📬 Activity Feed</div>
        <button class="btn btn-sm btn-secondary" onclick="NotificationsManager.loadNotificationsList()">🔄 Refresh</button>
      </div>

      <div id="notifications-list">
        <!-- Rendered via notifications.js -->
      </div>
    </div>

  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
